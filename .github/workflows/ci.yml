name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Demo and benchmark smoke run
        run: |
          PYTHONPATH=src python -m phasekv.cli demo --n-tokens 128 --keep 0.25
          PYTHONPATH=src python scripts/run_experiment.py --config config/default.yaml --out /tmp/experiment.json --measured-out /tmp/measured.json
